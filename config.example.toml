# ir-hub configuration template.
#
# Copy to ~/.config/ir-hub/config.toml and edit, or override any
# field via IRHUB_* environment variables (see README for the
# precedence order).
#
# Slack tokens may be set in the [slack] section below or via
# environment variables (env wins):
#
#   IRHUB_SLACK_APP_TOKEN  app-level token (connections:write, "xapp-...")
#   IRHUB_SLACK_BOT_TOKEN  bot token ("xoxb-...")
#
# If you put tokens in this file, keep it private:
#   chmod 600 ~/.config/ir-hub/config.toml
# ir-hub warns at startup when the file is group/other readable.

# UI language for everything Slack users see (modals, posts,
# errors): "en" or "ja". Logs stay English.
language = "en"

[gcp]
# Required for `serve`: the postmortem / status analysis runs on
# Vertex AI Gemini with Application Default Credentials.
project  = "your-project-id"
location = "us-central1"

[model]
# Per org ADR-001, stay on Gemini 2.5 until Gemini 3 GAs.
name = "gemini-2.5-flash"

[channel]
# Default visibility for case channels created by /ir-hub new.
# One of: private, public. Overridable per case with
# --private / --public flags.
default_visibility = "private"
# Case channels are named <prefix><sequence>-<slug>. The slug keeps
# Unicode letters/digits (Japanese titles stay readable); <= 80
# chars, unique workspace-wide incl. archived via the sequence.
name_prefix = "ir-"

[acl]
# Who may run /ir-hub commands and mention the bot.
# Evaluation order: deny lists first, then allow lists.
# With BOTH allow lists empty, everything is denied (fail-safe).
# Users are Slack user IDs (U…); groups are Slack User Group
# handles (e.g. "ir-team") or User Group IDs (e.g. "S0BAEBU39G8").
allow_users  = []
allow_groups = []
deny_users   = []
deny_groups  = []
# User Group membership cache TTL (seconds).
group_cache_ttl = 300
# Reply to denied users? Default false: silent + audit log only
# (noise control in large workspaces).
notify_denied = false

[analysis]
# Per-LLM-call timeout in seconds (postmortem stages, status summary).
request_timeout = 180
# Conversation token budget per analysis prompt; when a case exceeds
# it, the newest messages within budget are analyzed and the
# truncation is noted in the report.
max_input_tokens = 200000

[storage]
# Where finalized knowledge documents (JSON + Markdown pairs) are
# exported. One of: local, gcs, s3.
backend    = "local"
local_path = "./knowledge"
# gcs_bucket = "BUCKET_NAME"
# s3_bucket  = "BUCKET_NAME"
# s3_prefix  = "ir-hub/"

[db]
# Embedded SQLite database holding runtime state (case metadata,
# ingested messages, analysis results, knowledge index).
path = "~/.local/share/ir-hub/ir-hub.db"

[slack]
# Optional: tokens may live here instead of the environment.
# chmod 600 this file if you uncomment these.
# app_token = "xapp-REPLACE-ME"
# bot_token = "xoxb-REPLACE-ME"
